name: Testes do frontend
on:
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:
    inputs:
      backend_ref:
        description: Branch, tag ou commit do backend (em branco usa a branch padrão)
        required: false
        type: string
permissions:
  contents: read

jobs:
  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx tsc -p cypress/tsconfig.json
      - run: npm run build
      - uses: cypress-io/github-action@v6
        with:
          install: false
          start: npm run preview -- --port 3000 --strictPort
          wait-on: http://localhost:3000
          command: npm run cypress:run:mock
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          if-no-files-found: ignore


  full-stack:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - uses: actions/checkout@v4
        with:
          repository: SISGES/sisges-sboot-app
          ref: ${{ inputs.backend_ref || 'main' }}
          path: backend
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Disponibilizar PostgreSQL 16
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          echo 'PG_BINDIR=/usr/lib/postgresql/16/bin' >> "$GITHUB_ENV"
      - run: npm ci
        working-directory: frontend
      - run: npm run test:all
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: full-stack-screenshots
          path: frontend/cypress/screenshots/
          if-no-files-found: ignore
