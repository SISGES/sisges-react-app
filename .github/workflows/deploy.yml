# CI/CD: build frontend image, push to Docker Hub, deploy to EC2 on push to main.
#
# Required GitHub Secrets (Settings → Secrets and variables → Actions):
#   DOCKERHUB_USERNAME  - Docker Hub username (e.g. hugodfreitas)
#   DOCKERHUB_TOKEN     - Docker Hub access token (not your password)
#   EC2_HOST            - EC2 public IP or hostname
#   EC2_USER            - SSH user (e.g. ubuntu or ec2-user)
#   EC2_SSH_KEY         - Full contents of your .pem private key
#
# EC2 prerequisites: Docker, docker compose, ~/sisges-deploy with
# docker-compose.hub.yml and .env.prod.

name: Deploy Frontend

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          build-args: |
            VITE_API_BASE_URL=/api
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sisges-frontend:latest

      - name: Deploy frontend to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            export DOCKERHUB_USER=${{ secrets.DOCKERHUB_USERNAME }}
            cd ~/sisges-deploy
            docker compose -f docker-compose.hub.yml --env-file .env.prod pull frontend
            docker compose -f docker-compose.hub.yml --env-file .env.prod up -d frontend
